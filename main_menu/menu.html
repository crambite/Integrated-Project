<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blackbox Protocol</title>
  <link rel="stylesheet" href="menu.css">

  <script src="../player_data/player_data.js" defer></script>
  <script src="../player_data/map_data/map_data.js" defer></script>
</head>
<body>
    <main class="screen">
    <section class="panel">
        <h1 class="title">Blackbox Protocol</h1>

        <div class="btn-stack">
        <button class="menu-btn" id="play">Play</button>
        <button class="menu-btn" onclick="location.href='settings.html'">Settings</button>
        <button class="menu-btn" onclick="location.href='badges.html'">Badges</button>
        </div>
    </section>
    </main>

    <script>
        const play = document.getElementById("play")
        const data = JSON.parse(sessionStorage.getItem("data"))

        play.addEventListener("click", () => {
            //first time cutscene
            if (data["The_Room"] === false && data["open"] === false) {
                window.location.href = "../cutscenes/opening.html";

                return;
            }

            window.location.href = "../map_selection/map.html";
        });
    </script>
</body>

</html>
