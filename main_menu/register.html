<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login • Blackbox Protocol</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="screen">
        <section class="panel">
            <header class="header">
                <h1 class="title">Register</h1>
            </header>

            <form class="form" autocomplete="on">
                <label class="field">
                    <span class="label">Username</span>
                    <input class="input" type="text" name="username" placeholder="Enter username" required />
                </label>

                <label class="field">
                    <span class="label">Phone Number</span>
                    <input class="input" type="tel" name="phone" placeholder="Enter phone number" required />
                </label>

                <label class="field">
                    <span class="label">Password</span>
                    <input class="input" type="password" name="password" placeholder="Enter password" required />
                </label>

                <label class="field">
                    <span class="label">Confirm Password</span>
                    <input class="input" type="password" name="confirm_password" placeholder="Enter password" required />
                </label>

                <button class="primary-btn" type="submit">Register</button>

                <a class="links" href="login.html" aria-disabled="true">Login</a>
            </form>
    </section>
    </main>
</body>
</html>
