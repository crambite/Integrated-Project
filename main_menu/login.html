<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login • Blackbox Protocol</title>

    <link rel="stylesheet" href="login.css">

    <script src="../player_data/player_data.js" defer></script>
    <script type="module" src="../player_data/auth.js" defer></script>
</head>
<body>
    <main class="screen">
        <section class="panel">
            <header class="header">
                <h1 class="title">Sign in</h1>
            </header>

            <form class="form" autocomplete="on">

                <label class="field">
                    <span class="label">Phone Number</span>
                    <input class="input" type="tel" name="phone" placeholder="Enter phone number" required />
                </label>

                <label class="field">
                    <span class="label">Password</span>
                    <input class="input" type="password" name="password" placeholder="Enter password" required />
                </label>

                <button class="primary-btn" type="submit">Login</button>

                <a class="links" href="register.html" aria-disabled="true">Register</a>
                <a class="links" href="menu.html" aria-disabled="true">Continue Without Signing In</a>
            </form>
        </section>
    </main>
</body>
</html>
