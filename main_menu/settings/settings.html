<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Settings • Blackbox Protocol</title>

  <link rel="stylesheet" href="../menu.css">

  <script src="../../global_settings.js"></script>
  <script src="settings.js" defer></script>
</head>

<body>
  <div class="screen">
    <div class="panel">

      <!-- Header -->
      <div class="header">
        <div class="title">SETTINGS</div>
        <div class="subtitle">System configuration</div>
      </div>

      <!-- Centered Single Card -->
      <div class="card" style="width: min(520px, 100%);">

        <div class="card-title">GENERAL</div>

        <div class="row">
          <div class="row-label">Volume</div>
          <div class="row-control">
            <input class="range" id="volume_range" type="range" min="0" max="100" value="100" />
            <span class="value" id="volume_value">100</span>
          </div>
        </div>

        <div class="row">
          <div class="row-label">Brightness</div>
          <div class="row-control">
            <input class="range" id="brightness_range" type="range" min="25" max="100" value="100" />
            <span class="value" id="brightness_value">100</span>
          </div>
        </div>

        <div class="row">
          <div class="row-label">Text Speed</div>
          <div class="row-control">
            <select class="select" id="select">
              <option>Slow</option>
              <option>Normal</option>
              <option>Fast</option>
            </select>
          </div>
        </div>

      </div>

      <!-- Footer -->
      <div class="footer">
        <button class="ghost-btn" type="button" onclick="location.href='../menu.html'">Back</button>

        <div class="right">
          <button class="ghost-btn" id="logout" type="button">Logout</button>
          <button class="primary-btn" id="save" type="button">Save</button>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
