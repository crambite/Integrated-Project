<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Settings • Blackbox Protocol</title>
  <link rel="stylesheet" href="menu.css">
</head>

<body>
  <div class="screen">
    <div class="panel">

      <!-- Header -->
      <div class="header">
        <div class="title">SETTINGS</div>
        <div class="subtitle">System configuration</div>
      </div>

      <!-- Centered Single Card -->
      <div class="card" style="width: min(520px, 100%);">

        <div class="card-title">GENERAL</div>

        <div class="row">
          <div class="row-label">Volume</div>
          <div class="row-control">
            <input class="range" type="range" min="0" max="100" value="80" />
            <span class="value">80</span>
          </div>
        </div>

        <div class="row">
          <div class="row-label">Brightness</div>
          <div class="row-control">
            <input class="range" type="range" min="0" max="100" value="65" />
            <span class="value">65</span>
          </div>
        </div>

        <div class="row">
          <div class="row-label">Text Speed</div>
          <div class="row-control">
            <select class="select">
              <option>Slow</option>
              <option selected>Normal</option>
              <option>Fast</option>
              <option>Instant</option>
            </select>
          </div>
        </div>

      </div>

      <!-- Footer -->
      <div class="footer">
        <button class="ghost-btn" type="button">Back</button><!-- Daven figure out how to link this back -->

        <div class="right">
          <button class="ghost-btn" type="button">Cancel</button>
          <button class="primary-btn" type="button">Save</button>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
